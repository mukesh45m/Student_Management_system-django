<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <a href="/add_marks/{{student.id}}/" class="btn btn-success mb-4">Add Marks</a>
    <a href="/" class="btn btn-secondary mb-4">Back to Home</a>
    <div class="card shadow p-4 mb-4">
        <h2 class="text-primary mb-4">Profile Details</h2>
        <h5><strong>Name:</strong> {{student.name}}</h5>
        <h5><strong>Roll No:</strong> {{student.roll_no}}</h5>
        <h5><strong>Year:</strong> {{student.year}}</h5>
    </div>
    <div class="card shadow p-4">
        <h2 class="text-success mb-4">Marks Details</h2>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                {% for m in marks %}
                <tr>
                    <td>{{m.subject}}</td>
                    <td>{{m.marks}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="mt-4">
            <h4 class="text-primary">Total Marks : {{total}}</h4>
            <h4 class="text-success">Percentage : {{percentage}}</h4>
        </div>
    </div>
</div>

</body>
</html>
