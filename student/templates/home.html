<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">{{ user.username|title }}</h2>
        <div>
            <a href="/add/" class="btn btn-success">Add Details</a>
            <a href="/logout/" class="btn btn-danger ">Logout</a>
        </div>
    </div>
    <form method="get" class="mb-4">
        <div class="input-group">
        {% comment %} search karne ke liye input bana rahe hai {% endcomment %}
            <input type="text" name="search" class="form-control" placeholder="Search student">
            <button type="submit" class="btn btn-dark">Search</button>
        </div>
    </form>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th width="300">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.roll_no }}</td>
                <td>{{ s.name }}</td>
                <td>
                    <a href="/student/{{s.id}}/" class="btn btn-info btn-sm">Show Info</a>
                    <a href="/edit/{{s.id}}/" class="btn btn-primary btn-sm">Edit</a>
                    <a href="/delete/{{s.id}}/" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
